<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kamernet Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: header, one filter card (basic filters, then tags grouped by topic), a sticky action bar, then one column of listing cards.
   Badges are tinted by meaning: green = good for you, amber = restricts who can rent, red = problem, grey = neutral. Price per person is the big number. */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --ink:#15202b; --muted:#5b6978; --line:#dce2e8;
  --accent:#0b62c4; --accent-soft:#e1edfb; --ok:#1c7a4b; --ok-soft:#dff2e8; --warn:#8f5700; --warn-soft:#fbefd3; --bad:#b3261e; --bad-soft:#fbe4e2;
  --sans:"IBM Plex Sans",system-ui,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161c; --surface:#18212a; --ink:#e7edf3; --muted:#93a1af; --line:#2a3642;
  --accent:#6aaeff; --accent-soft:#16304d; --ok:#6fd09a; --ok-soft:#173526; --warn:#efb85a; --warn-soft:#3a2d12; --bad:#f19089; --bad-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161c; --surface:#18212a; --ink:#e7edf3; --muted:#93a1af; --line:#2a3642;
  --accent:#6aaeff; --accent-soft:#16304d; --ok:#6fd09a; --ok-soft:#173526; --warn:#efb85a; --warn-soft:#3a2d12; --bad:#f19089; --bad-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:clamp(24px,5vw,32px);line-height:1.1;margin:0;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
button,select,input{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.label{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:78px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0;flex:1 1 0}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer;line-height:1.5}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.in{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.chip.out{background:var(--bad-soft);color:var(--bad);border-color:var(--bad);text-decoration:line-through}
.chip small{font-family:var(--mono);opacity:.65;margin-left:5px;font-size:11px}
.field{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);flex:1 1 300px}
.field input[type=range]{flex:1 1 140px;min-width:0;accent-color:var(--accent)}
.field output{font-family:var(--mono);color:var(--ink);min-width:62px;text-align:right}
input[type=search],select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:14px;min-width:0}
input[type=search]{flex:1 1 180px}
.subs{display:flex;flex-wrap:wrap;gap:12px 28px}
.subs .row{flex:1 1 230px;flex-direction:column;align-items:flex-start;gap:5px}
.subs .row.wide{flex-basis:100%}
.subs .label{min-width:0}
details.tagbox{border-top:1px solid var(--line);padding-top:10px}
details.tagbox>summary{cursor:pointer;font-weight:500;font-size:14px;display:flex;gap:8px;align-items:center}
details.tagbox>summary small{color:var(--muted);font-weight:400}
.groups{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:8px;padding:7px 14px;font-weight:500;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:default}
.lock{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.lock input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;min-width:0;flex:1 1 140px}
.msg{font-size:13px;color:var(--muted);min-height:1.2em}
.msg.err{color:var(--bad)}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:8px 14px}
.thumb{width:76px;height:76px;border-radius:10px;background:var(--bg) center/cover;grid-row:1 / span 2}
.where{min-width:0}
.street{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px}
.price{text-align:right;font-variant-numeric:tabular-nums}
.pp{font-size:22px;font-weight:600;line-height:1.1;font-family:var(--mono)}
.pp small{font:12px var(--sans);color:var(--muted)}
.tot{font-size:12px;color:var(--muted)}
.badges{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.badge{font-size:12px;font-weight:500;padding:2px 9px;border-radius:7px;background:var(--bg);color:var(--muted);border:1px solid transparent;white-space:nowrap}
.badge.good{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.lang{border-color:currentColor}
.state{font-size:12px;font-weight:600;padding:2px 9px;border-radius:7px}
.state.on{background:var(--accent);color:var(--surface)}
.state.off{border:1px dashed var(--line);color:var(--muted);font-weight:400}
.summary{grid-column:1 / -1;font-size:14.5px}
.flags{grid-column:1 / -1;font-size:13px;color:var(--bad)}
.cols{grid-column:1 / -1;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 18px;font-size:13.5px}
.cols h4{margin:0 0 3px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.cols ul{margin:0;padding-left:18px}
.cols li{margin:1px 0}
.nudge{grid-column:1 / -1;font-size:13px;color:var(--muted)}
details.more{grid-column:1 / -1;font-size:13px}
details.more>summary{cursor:pointer;color:var(--muted)}
.full{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:6px;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:13.5px;max-height:360px;overflow:auto}
.actions{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;border-top:1px solid var(--line);padding-top:10px}
.actions a{margin-left:auto}
.stat{border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:3px 8px;font-size:13px}
.stat[data-s="interested"]{background:var(--accent-soft)} .stat[data-s="applied"],.stat[data-s="replied"],.stat[data-s="viewing"]{background:var(--ok-soft)} .stat[data-s="rejected"],.stat[data-s="dead"]{background:var(--bad-soft)}
.more-btn{display:flex;justify-content:center;padding:6px 0}
.empty{color:var(--muted);padding:28px 0;text-align:center}
@media (max-width:520px){.card{grid-template-columns:60px minmax(0,1fr) auto}.thumb{width:60px;height:60px}.pp{font-size:19px}.label{min-width:100%}}
@media (prefers-reduced-motion:no-preference){.chip,.btn{transition:background .12s,color .12s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Kamernet Live</h1>
    <p class="sub" id="sub">Loading listings…</p>
  </header>

  <section class="filters" aria-label="Filters">
    <div class="row"><span class="label">City</span><div class="chips" id="cities" role="group" aria-label="City"></div></div>
    <div class="row">
      <label class="field">Max per person <input type="range" id="max" min="300" max="2500" step="25" value="900"><output id="maxo">€900</output></label>
      <input type="search" id="q" placeholder="Search street or city" aria-label="Search street or city">
    </div>
    <div class="subs">
      <div class="row"><span class="label">Type</span><div class="chips" id="kinds" role="group" aria-label="Type"></div></div>
      <div class="row"><span class="label">Registration</span><div class="chips" id="regs" role="group" aria-label="Registration"></div></div>
      <div class="row"><span class="label">AI read</span><div class="chips" id="dist" role="group" aria-label="Distilled"></div></div>
      <div class="row"><span class="label">Prices</span><div class="chips" id="cheap" role="group" aria-label="Very cheap listings"></div></div>
      <div class="row wide"><span class="label">My status</span><div class="chips" id="stat" role="group" aria-label="My status"></div></div>
    </div>
    <details class="tagbox" open>
      <summary>Rules, language and features <small id="tagsel"></small></summary>
      <p class="hint">Tap a tag once to require it, twice to hide listings that have it, a third time to clear. Counts are listings in the database.</p>
      <div class="groups" id="taggroups"></div>
    </details>
  </section>

  <div class="bar">
    <span class="count" id="count"></span>
    <div class="row">
      <select id="sort" aria-label="Sort">
        <option value="per_person.asc.nullslast">Cheapest per person</option>
        <option value="first_seen_at.desc">Newest first</option>
        <option value="size_m2.desc.nullslast">Biggest first</option>
        <option value="available_from.asc.nullslast">Available soonest</option>
      </select>
      <button class="btn" id="distill" type="button" disabled title="Needs the passcode">Distill 25</button>
    </div>
  </div>
  <div class="msg" id="msg" role="status"></div>

  <section class="lock" id="lock" aria-label="Passcode">
    <span>Passcode for Distill and statuses:</span>
    <input type="password" id="pass" autocomplete="current-password" placeholder="passcode" aria-label="Passcode">
    <button class="btn ghost" id="passbtn" type="button">Unlock</button>
  </section>

  <div class="list" id="list"></div>
  <div class="more-btn"><button class="btn ghost" id="more" type="button" hidden>Load more</button></div>
</div>

<script>
// ---- Settings (public values only; the passcode is typed in the browser and never stored in this file) ----
const SUPA = "https://sldfjyrpopypzbmhvbkq.supabase.co";
const KEY = "sb_publishable_nsKv4ERySCv5KbJXhdqnqQ_eQn3Gu3z";
const PAGE = 30;
const STATUSES = ["new","interested","applied","replied","viewing","rejected","dead"];
const CITIES = ["Rotterdam","Amsterdam","Den Haag","Utrecht","Delft","Nijmegen"];

// ---- Tag groups: how tags are sorted on the filter panel and on each card ----
const GROUPS = [
  { id: "lang",  label: "Language",     tags: ["dutch-only","dutch-preferred","english-ok","internationals-welcome","ad-in-dutch"] },
  { id: "reg",   label: "Registration", tags: ["registration-ok","no-registration"] },
  { id: "who",   label: "Who can rent", tags: ["women-only","men-only","students-only","no-students","no-couples","working-professionals","expat-friendly"] },
  { id: "stay",  label: "Stay",         tags: ["short-term","fixed-end-date","open-ended","sublet"] },
  { id: "cost",  label: "Costs",        tags: ["bills-included","bills-extra","high-deposit"] },
  { id: "house", label: "House",        tags: ["furnished","live-in-landlord","no-pets","no-smoking","quiet"] },
  { id: "warn",  label: "Watch out",    tags: ["offsite-contact","scam-risk"] },
];
const OTHER = { id: "other", label: "Features and more" };
const GROUP_OF = {}; GROUPS.forEach((g, i) => g.tags.forEach((t) => (GROUP_OF[t] = i)));
const TONE = {
  good: ["registration-ok","english-ok","internationals-welcome","bills-included","furnished","open-ended","expat-friendly","dutch-preferred"],
  bad:  ["no-registration","dutch-only","offsite-contact","scam-risk","high-deposit"],
  warn: ["women-only","men-only","students-only","no-students","no-couples","sublet","short-term","live-in-landlord","working-professionals"],
};
const toneOf = (t) => TONE.good.includes(t) ? "good" : TONE.bad.includes(t) ? "bad" : TONE.warn.includes(t) ? "warn" : "";
const SPECIAL = { "english-ok": "English OK", "ad-in-dutch": "Ad in Dutch", "registration-ok": "Registration OK", "no-registration": "No registration", "dutch-only": "Dutch only", "dutch-preferred": "Dutch preferred" };
const label = (t) => SPECIAL[t] || (t.replace(/-/g, " ").replace(/^./, (c) => c.toUpperCase()));

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const eur = (n) => "€" + Number(n).toLocaleString("en-GB");
const cap = (s) => String(s ?? "").replace(/^./, (c) => c.toUpperCase());
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };

const S = Object.assign({
  cities: [], max: 900, q: "", kinds: [], reg: "any", dist: "any", stat: "any", cheap: "hide",
  tags: {}, // tag -> "in" | "out"
  sort: "per_person.asc.nullslast",
}, (() => { try { return JSON.parse(store.get("kn_state") || "{}"); } catch { return {}; } })());
let pass = store.get("kn_pass") || "";
let statuses = {};
let offset = 0, total = 0, loaded = [];
let tagCounts = [];
function persist(){ store.set("kn_state", JSON.stringify(S)); }

// ---- Supabase calls ----
async function rest(path, extra = {}){
  const res = await fetch(`${SUPA}/rest/v1/${path}`, { headers: { apikey: KEY, ...extra } });
  if (!res.ok) throw new Error(`Database ${res.status}`);
  return res;
}
async function fn(name, opts = {}){
  const res = await fetch(`${SUPA}/functions/v1/${name}`, { ...opts, headers: { "x-passcode": pass, "content-type": "application/json", ...(opts.headers||{}) } });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
  return body;
}

// ---- Query building ----
function filters(){
  const p = ["gone_at=is.null"];
  if (S.cities.length) p.push(`city=in.(${S.cities.map((c) => `"${c}"`).join(",")})`);
  if (S.kinds.length) p.push(`kind=in.(${S.kinds.join(",")})`);
  const ands = [];
  if (S.max < 2500) ands.push(`or(per_person.lte.${S.max},per_person.is.null)`);
  if (S.cheap !== "show") ands.push("or(per_person.gte.250,per_person.is.null)"); // prices under 250 are almost always typos
  const q = S.q.trim().replace(/[(),*"]/g, " ").trim();
  if (q) ands.push(`or(street.ilike.*${q}*,city.ilike.*${q}*)`);
  if (ands.length) p.push(`and=(${ands.join(",")})`);
  if (S.reg !== "any") p.push(S.reg === "ok" ? "reg=eq.yes" : S.reg === "not" ? "reg=eq.no" : "reg=eq.unknown");
  if (S.dist === "yes") p.push("distilled_at=not.is.null");
  if (S.dist === "no") p.push("distilled_at=is.null");
  const inc = Object.keys(S.tags).filter((t) => S.tags[t] === "in");
  const out = Object.keys(S.tags).filter((t) => S.tags[t] === "out");
  if (inc.length) p.push(`all_tags=cs.{${inc.join(",")}}`);
  for (const t of out) p.push(`all_tags=not.cs.{${t}}`);
  if (S.stat !== "any"){
    const ids = Object.keys(statuses).filter((id) => statuses[id].status === S.stat);
    p.push(S.stat === "new" ? (Object.keys(statuses).length ? `id=not.in.(${Object.keys(statuses).join(",")})` : "id=gt.0") : `id=in.(${ids.length ? ids.join(",") : 0})`);
  }
  return p;
}
const SELECT = "id,url,kind,city,street,title,price,people,per_person,size_m2,utilities_incl,deposit,available_from,available_until,tags,distill_tags,reg,distilled_at,distill_model,distilled,photos,first_seen_at";
function qs(extra){ return [...filters(), `order=${S.sort}`, ...extra].join("&"); }

// ---- Cards ----
const day = (s) => s ? new Date(s + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" }) : "";
function badgeList(r){
  const all = [...new Set([...(r.tags || []), ...(r.distill_tags || [])])];
  if (r.reg === "yes" && !all.includes("registration-ok")) all.push("registration-ok");
  if (r.reg === "no" && !all.includes("no-registration")) all.push("no-registration");
  const rank = (t) => (t in GROUP_OF ? GROUP_OF[t] : 99);
  const hide = ["no-pets", "no-smoking"];
  return all.filter((t) => !hide.includes(t)).sort((a, b) => rank(a) - rank(b) || a.localeCompare(b)).slice(0, 14);
}
function list(title, arr){
  arr = (arr || []).filter(Boolean);
  return arr.length ? `<div><h4>${title}</h4><ul>${arr.map((x) => `<li>${esc(cap(x))}</li>`).join("")}</ul></div>` : "";
}
function buckets(r){
  const d = r.distilled;
  if (!d) return `<div class="nudge">Not read by AI yet. Distill sorts the ad into requirements, preferences, house rules, features and notes.</div>`;
  const lang = d.language || {};
  const langLine = [lang.dutch === "required" ? "Dutch required" : lang.dutch === "preferred" ? "Dutch preferred" : lang.dutch === "not-needed" ? "Dutch not needed" : "", lang.english_ok === true ? "English OK" : "", ...(lang.other || [])].filter(Boolean);
  const who = d.who_its_for || {};
  const reqs = [...(d.requirements || [])];
  const stay = d.stay || {};
  const stayLine = [stay.min_months ? `Minimum ${stay.min_months} months` : "", stay.max_months ? `Maximum ${stay.max_months} months` : "", stay.fixed_end_date ? `Ends ${stay.fixed_end_date}` : ""].filter(Boolean);
  const costs = d.costs || {};
  const costLine = [costs.bills && costs.bills !== "unclear" ? `Bills ${costs.bills}` : "", costs.deposit_note, ...(costs.other_fees || [])].filter(Boolean);
  return `<div class="cols">
    ${list("Language", langLine)}${list("Requirements", reqs)}${list("Preferences", d.preferences)}${list("House rules", d.house_rules)}
    ${list("Stay and costs", [...stayLine, ...costLine])}${list("Features", d.features)}${list("Notes", d.notes)}
  </div>${d.registration_evidence ? `<div class="nudge">Registration: “${esc(d.registration_evidence)}”</div>` : ""}`;
}
function card(r){
  const st = statuses[r.id]?.status || "new";
  const d = r.distilled;
  const avail = r.available_from ? (r.available_from <= new Date().toISOString().slice(0,10) ? "Available now" : "From " + day(r.available_from)) + (r.available_until ? " until " + day(r.available_until) : "") : "";
  const flags = (d?.red_flags || []).slice(0, 3);
  return `<article class="card" data-id="${r.id}">
    <div class="thumb" style="${r.photos?.[0] ? `background-image:url('${esc(r.photos[0])}')` : ""}" role="img" aria-label="Photo"></div>
    <div class="where"><div class="street">${esc(r.street)}</div>
      <div class="meta"><span>${esc(r.city)}</span><span>${esc(cap(r.kind))}${r.size_m2 ? " · " + r.size_m2 + " m²" : ""}</span>${avail ? `<span>${esc(avail)}</span>` : ""}</div></div>
    <div class="price"><div class="pp">${r.per_person != null ? eur(r.per_person) : eur(r.price)}<small> ${r.per_person != null ? "/pp" : "total"}</small></div>
      <div class="tot">${r.people > 1 ? `${eur(r.price)} ÷ ${r.people}` : r.people == null ? "People unknown" : "Per month"}</div></div>
    <div class="badges">
      ${r.distilled_at ? `<span class="state on" title="Read by ${esc(r.distill_model || "AI")} on ${esc(r.distilled_at.slice(0,10))}">Distilled</span>` : '<span class="state off">Not distilled</span>'}
      ${r.reg === "unknown" ? '<span class="badge">Registration unknown</span>' : ""}
      ${badgeList(r).map((t) => `<span class="badge ${toneOf(t)} ${GROUP_OF[t] === 0 ? "lang" : ""}">${esc(label(t))}</span>`).join("")}
    </div>
    ${d?.summary ? `<div class="summary">${esc(d.summary)}</div>` : ""}
    ${flags.length ? `<div class="flags">⚠ ${esc(flags.join(" · "))}</div>` : ""}
    ${buckets(r)}
    <details class="more" data-full="${r.id}"><summary>Full ad text</summary><div class="full">Loading…</div></details>
    <div class="actions"><label>Status <select class="stat" data-s="${st}" data-id="${r.id}" ${pass ? "" : "disabled title='Unlock with the passcode'"}>${STATUSES.map((s) => `<option value="${s}" ${s === st ? "selected" : ""}>${cap(s)}</option>`).join("")}</select></label>
      <a href="${esc(r.url)}" target="_blank" rel="noopener">Open on Kamernet ↗</a></div>
  </article>`;
}
function renderList(){
  $("list").innerHTML = loaded.length ? loaded.map(card).join("") : '<div class="empty">Nothing matches these filters.</div>';
  const nd = loaded.filter((r) => r.distilled_at).length;
  $("count").textContent = `${total.toLocaleString("en-GB")} listing${total === 1 ? "" : "s"} · showing ${loaded.length} (${nd} distilled)`;
  $("more").hidden = loaded.length >= total;
}

// ---- Filter panel ----
function chips(el, opts, get, set, multi){
  el.innerHTML = opts.map(([v, text]) => `<button class="chip" type="button" data-v="${esc(v)}" aria-pressed="${multi ? S[get].includes(v) : S[get] === v}">${esc(text)}</button>`).join("");
  el.onclick = (e) => { const b = e.target.closest(".chip"); if (!b) return; set(b.dataset.v); persist(); renderPanel(); load(true); };
}
function renderTags(){
  const n = Object.fromEntries(tagCounts.map((t) => [t.tag, t.n]));
  const chip = (t) => `<button class="chip ${S.tags[t] || ""}" type="button" data-t="${esc(t)}">${esc(label(t))}${n[t] != null ? `<small>${n[t]}</small>` : ""}</button>`;
  const rows = GROUPS.map((g) => {
    const tags = g.tags.filter((t) => n[t] > 0 || S.tags[t]);
    return tags.length ? `<div class="row"><span class="label">${g.label}</span><div class="chips">${tags.map(chip).join("")}</div></div>` : "";
  });
  const extra = tagCounts.filter((t) => !(t.tag in GROUP_OF) && t.n >= 2).sort((a, b) => b.n - a.n).map((t) => t.tag).slice(0, 24);
  for (const t of Object.keys(S.tags)) if (!(t in GROUP_OF) && !extra.includes(t)) extra.push(t);
  if (extra.length) rows.push(`<div class="row"><span class="label">${OTHER.label}</span><div class="chips">${extra.map(chip).join("")}</div></div>`);
  $("taggroups").innerHTML = rows.join("");
  const sel = Object.keys(S.tags).length;
  $("tagsel").textContent = sel ? `${sel} selected` : "";
}
function renderPanel(){
  chips($("cities"), [["__all", "All cities"], ...CITIES.map((c) => [c, c])], "cities", (v) => { S.cities = v === "__all" ? [] : S.cities.includes(v) ? S.cities.filter((x) => x !== v) : [...S.cities, v]; }, true);
  $("cities").querySelector('[data-v="__all"]').setAttribute("aria-pressed", S.cities.length ? "false" : "true");
  chips($("kinds"), [["room","Rooms"],["studio","Studios"],["apartment","Apartments"]], "kinds", (v) => { S.kinds = S.kinds.includes(v) ? S.kinds.filter((x) => x !== v) : [...S.kinds, v]; }, true);
  chips($("regs"), [["any","Any"],["ok","Registration OK"],["unknown","Unknown"],["not","No registration"]], "reg", (v) => { S.reg = v; }, false);
  chips($("dist"), [["any","Any"],["yes","Distilled"],["no","Not distilled"]], "dist", (v) => { S.dist = v; }, false);
  chips($("cheap"), [["hide","Hide under €250 (typos)"],["show","Show them"]], "cheap", (v) => { S.cheap = v; }, false);
  chips($("stat"), [["any","Any"],...STATUSES.map((s) => [s, cap(s)])], "stat", (v) => { S.stat = v; }, false);
  $("max").value = S.max; $("maxo").textContent = S.max >= 2500 ? "No limit" : eur(S.max);
  $("q").value = S.q; $("sort").value = S.sort;
  renderTags();
  $("distill").disabled = !pass;
  $("passbtn").textContent = pass ? "Lock" : "Unlock";
  $("pass").placeholder = pass ? "Passcode saved on this device" : "passcode";
  $("pass").value = "";
}

// ---- Loading ----
let loadToken = 0;
async function load(reset){
  const my = ++loadToken;
  if (reset){ offset = 0; loaded = []; }
  $("msg").className = "msg"; $("msg").textContent = "";
  try {
    const res = await rest(`listings?select=${SELECT}&${qs([`limit=${PAGE}`, `offset=${offset}`])}`, { Prefer: "count=exact" });
    const rows = await res.json();
    if (my !== loadToken) return;
    total = Number((res.headers.get("content-range") || "").split("/")[1]) || rows.length;
    loaded = loaded.concat(rows); offset += rows.length;
    renderList();
  } catch (e) { $("msg").className = "msg err"; $("msg").textContent = "Couldn't load listings: " + e.message; }
}
async function loadTags(){ try { tagCounts = await (await rest("tag_counts?select=tag,n&order=n.desc&limit=200")).json(); renderTags(); } catch {} }
async function loadStatuses(){
  if (!pass) return;
  try { const b = await fn("status"); statuses = Object.fromEntries(b.statuses.map((s) => [String(s.id), s])); }
  catch (e) { $("msg").className = "msg err"; $("msg").textContent = "Statuses: " + e.message; if (/passcode/.test(e.message)) { pass = ""; store.set("kn_pass", ""); renderPanel(); } }
}
async function headline(){
  try {
    const n = (await rest("listings?select=id&gone_at=is.null&limit=1", { Prefer: "count=exact" })).headers.get("content-range").split("/")[1];
    const nd = (await rest("listings?select=id&gone_at=is.null&distilled_at=not.is.null&limit=1", { Prefer: "count=exact" })).headers.get("content-range").split("/")[1];
    $("sub").textContent = `${Number(n).toLocaleString("en-GB")} listings saved · ${Number(nd).toLocaleString("en-GB")} distilled`;
  } catch { $("sub").textContent = "Live from Kamernet"; }
}

// ---- Events ----
$("max").oninput = (e) => { S.max = Number(e.target.value); $("maxo").textContent = S.max >= 2500 ? "No limit" : eur(S.max); };
$("max").onchange = () => { persist(); load(true); };
let qt; $("q").oninput = (e) => { S.q = e.target.value; clearTimeout(qt); qt = setTimeout(() => { persist(); load(true); }, 350); };
$("sort").onchange = (e) => { S.sort = e.target.value; persist(); load(true); };
$("more").onclick = () => load(false);
$("taggroups").onclick = (e) => {
  const b = e.target.closest(".chip"); if (!b) return; const t = b.dataset.t;
  if (!S.tags[t]) S.tags[t] = "in"; else if (S.tags[t] === "in") S.tags[t] = "out"; else delete S.tags[t];
  persist(); renderTags(); load(true);
};
$("passbtn").onclick = async () => {
  const v = $("pass").value.trim();
  if (!v && pass){ pass = ""; store.set("kn_pass", ""); statuses = {}; renderPanel(); renderList(); return; }
  if (!v) return;
  pass = v; store.set("kn_pass", v);
  await loadStatuses(); renderPanel(); renderList();
};
$("list").addEventListener("toggle", async (e) => {
  const d = e.target; if (!(d instanceof HTMLDetailsElement) || !d.open || !d.dataset.full || d.dataset.loaded) return;
  d.dataset.loaded = "1";
  try {
    const rows = await (await rest(`listings?select=description&id=eq.${d.dataset.full}`)).json();
    d.querySelector(".full").textContent = rows[0]?.description || "No description.";
  } catch { d.querySelector(".full").textContent = "Couldn't load the ad text."; delete d.dataset.loaded; }
}, true);
$("list").onchange = async (e) => {
  const sel = e.target.closest("select.stat"); if (!sel) return;
  const id = sel.dataset.id, status = sel.value;
  sel.dataset.s = status;
  try {
    await fn("status", { method: "POST", body: JSON.stringify({ id: Number(id), status, note: statuses[id]?.note ?? null }) });
    if (status === "new") delete statuses[id]; else statuses[id] = { ...(statuses[id] || {}), status };
    $("msg").className = "msg"; $("msg").textContent = `Saved: ${cap(status)}`;
  } catch (err) { $("msg").className = "msg err"; $("msg").textContent = "Couldn't save status: " + err.message; }
};
$("distill").onclick = async () => {
  const btn = $("distill"); btn.disabled = true; $("msg").className = "msg";
  try {
    $("msg").textContent = "Finding the first 25 listings that haven't been distilled…";
    const ids = (await (await rest(`listings?select=id&${qs(["distilled_at=is.null", "limit=25"])}`)).json()).map((r) => r.id);
    if (!ids.length){ $("msg").textContent = "Everything in this view is already distilled."; return; }
    $("msg").textContent = `Distilling ${ids.length} listings… this takes about ${Math.max(10, ids.length)} seconds.`;
    const r = await fn("distill", { method: "POST", body: JSON.stringify({ ids }) });
    $("msg").textContent = `Distilled ${r.distilled}${r.failed?.length ? `, ${r.failed.length} failed (${r.failed[0].error})` : ""} · cost $${r.total_cost_usd}`;
    await Promise.all([load(true), headline(), loadTags()]);
  } catch (e) { $("msg").className = "msg err"; $("msg").textContent = "Distill failed: " + e.message; }
  finally { btn.disabled = !pass; }
};

// ---- Start ----
(async () => {
  renderPanel();
  await loadStatuses();
  renderPanel();
  await Promise.all([load(true), headline(), loadTags()]);
})();
</script>
</body>
</html>
